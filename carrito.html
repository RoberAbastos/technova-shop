<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito de compra</title>
<link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>
<header>
<h1>TechNova Solutions</h1>
<nav>
<a href="index.html">Inicio</a>
<a href="tienda.html">Tienda</a>
</nav>
</header>
<div class="container">
<div class="card">
<h2>Carrito de compra</h2>
<div id="listaProductos"></div>
<hr>
<h3 id="cantidad"></h3>
<h2 id="total"></h2>
<br>
<button id="btnVaciar" class="btn" onclick="vaciarCarrito()">Vaciar carrito</button>
<button id="btnComprar" class="btn" onclick="realizarCompra()">Finalizar compra</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl='TU_URL';
const supabaseKey='TU_PUBLISHABLE_KEY';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);
let carrito=JSON.parse(localStorage.getItem('carrito'))||[];
let lista=document.getElementById('listaProductos');
let total=0;
if(carrito.length===0){
 lista.innerHTML='<p>No hay productos en el carrito.</p>';
 document.getElementById('btnComprar').style.display='none';
 document.getElementById('btnVaciar').style.display='none';
}else{
 carrito.forEach(producto=>{
  lista.innerHTML+=`<div class="card"><h3>${producto.nombre}</h3><p>Precio: ${producto.precio} €</p></div>`;
  total+=Number(producto.precio);
 });
}
document.getElementById('cantidad').textContent='Productos: '+carrito.length;
document.getElementById('total').textContent='Total: '+total+' €';
function vaciarCarrito(){if(confirm('¿Seguro que deseas vaciar el carrito?')){localStorage.removeItem('carrito');location.reload();}}
async function realizarCompra(){
 const nombre=prompt('Nombre del cliente'); if(!nombre) return;
 const email=prompt('Correo electrónico'); if(!email) return;
 const telefono=prompt('Teléfono'); if(!telefono) return;
 try{
 const {data:cliente,error:errorCliente}=await supabaseClient.from('clientes').insert([{nombre,email,telefono}]).select().single();
 console.log('CLIENTE',cliente); console.log('ERROR CLIENTE',errorCliente);
 if(errorCliente){alert('Error al guardar cliente'); return;}
 const {data:pedido,error:errorPedido}=await supabaseClient.from('pedidos').insert([{cliente_id:cliente.id,total:total,fecha:new Date().toISOString()}]).select();
 console.log('PEDIDO',pedido); console.log('ERROR PEDIDO',errorPedido);
 if(errorPedido){alert('Error al guardar pedido'); return;}
 localStorage.removeItem('carrito');
 window.location.href='confirmacion.html';
 }catch(error){console.error(error);alert('Error inesperado');}
}
</script>
</body>
</html>
