<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda</title>

    <link rel="stylesheet" href="estilos/estilos.css">
</head>

<body>

    <header>

        <h1>TechNova Solutions</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="quienes.html">Quiénes somos</a>
            <a href="donde.html">Dónde estamos</a>
            <a href="referencias.html">Referencias</a>
            <a href="tienda.html">Tienda</a>
        </nav>

    </header>

    <div class="container">

        <h2>Tienda online</h2>

        <!-- Aquí aparecerán los productos -->

        <div class="productos" id="productos"></div>

        <p>
            <a class="btn" href="carrito.html">
                Ver carrito
            </a>
        </p>

    </div>

    <!-- SDK Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const supabaseUrl =
            "PEGA_AQUI_TU_URL";

        const supabaseKey =
            "PEGA_AQUI_TU_PUBLISHABLE_KEY";

        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        async function cargarProductos() {

            const { data, error } =
                await supabaseClient
                    .from("productos")
                    .select("*");

            if (error) {

                console.error(error);

                return;

            }

            const contenedor =
                document.getElementById("productos");

            contenedor.innerHTML = "";

            data.forEach(producto => {

                contenedor.innerHTML += `

                <div class="card producto">

                    <img
                        src="${producto.imagen}"
                        alt="${producto.nombre}"
                    >

                    <h3>
                        ${producto.nombre}
                    </h3>

                    <p>
                        ${producto.precio} €
                    </p>

                    <a
                        class="btn"
                        href="producto.html?id=${producto.id}"
                    >
                        Ver producto
                    </a>

                </div>

                `;

            });

        }

        cargarProductos();

    </script>

</body>

</html>
